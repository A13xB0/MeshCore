; ============================================================================
; MeshOS repeater - unified device build matrix
;
; One source tree, two feature sets:
;   * ESP32 boards          -> the FULL repeater (web UI, observer/MQTT, AirLink,
;                              self-update, WiFi+NTP)       examples/meshos_repeater/
;   * nRF52 / RP2040 boards -> the LITE repeater (spam filter + config + CLI)
;                                                           examples/meshos_repeater_lite/
;
; Each env extends its *board base* (e.g. Heltec_lora32_v3) rather than the stock
; _repeater env, so no display/UITask source is pulled in (the full repeater runs
; headless), and swaps the example source in through the shared file-list snippets
; below. To add a board: copy the matching block and point `extends` plus the
; three ${board...} references at that board's base section.
; ============================================================================

; ---- shared source file lists (edit once, applies to every board) ----
[meshos_full_src]
files =
  +<../examples/meshos_repeater/MeshOSFull.cpp>
  +<../examples/meshos_repeater/main.cpp>
  +<../examples/meshos_repeater/WebInterface.cpp>
  +<../examples/meshos_repeater/Observer.cpp>
  +<../examples/meshos_repeater/AirLink.cpp>
  +<../examples/meshos_repeater/SelfUpdate.cpp>
  +<../examples/meshos_repeater/EspNet.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
  +<../examples/simple_repeater/MyMesh.cpp>

[meshos_lite_src]
files =
  +<../examples/meshos_repeater_lite/*.cpp>
  +<../examples/simple_repeater/MyMesh.cpp>

; common repeater build flags (location / admin password / neighbour cap)
[meshos_flags]
build_flags =
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50

; ============================ ESP32 boards -> FULL ============================

[env:Heltec_v2_meshos_full]
extends = Heltec_lora32_v2
build_flags =
  ${Heltec_lora32_v2.build_flags}
  ${meshos_flags.build_flags}
  -D ADVERT_NAME='"Heltec v2 Repeater"'
build_src_filter =
  ${Heltec_lora32_v2.build_src_filter}
  ${meshos_full_src.files}
lib_deps =
  knolleary/PubSubClient @ ^2.8
  ${Heltec_lora32_v2.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

